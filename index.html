<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌟 小可爱的时光相册</title>
<style>
  :root {
    --pink: #ffb8c6;
    --pink-lt: #ffe0e6;
    --pink-bg: #fff0f3;
    --mint: #b8e6d0;
    --mint-lt: #d4f5e4;
    --lavender: #d5c6f0;
    --white: #fffafa;
    --text: #5c4b51;
    --text-lt: #9b8e94;
    --shadow: rgba(255,150,170,.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(170deg, #fff5f7 0%, #ffeef2 30%, #fde8f0 60%, #f8e8ff 100%);
    color: var(--text);
    font-family: "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* ── Floating Sparkles ── */
  .sparkles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .sparkle {
    position: absolute;
    animation: float 6s ease-in-out infinite;
    opacity: .55;
    font-size: 22px;
  }
  .sparkle:nth-child(1) { top: 8%; left: 10%; animation-delay: 0s; font-size: 18px; }
  .sparkle:nth-child(2) { top: 15%; right: 12%; animation-delay: 1.2s; }
  .sparkle:nth-child(3) { top: 45%; left: 6%; animation-delay: 2.4s; font-size: 26px; }
  .sparkle:nth-child(4) { top: 60%; right: 8%; animation-delay: .6s; font-size: 16px; }
  .sparkle:nth-child(5) { top: 25%; left: 50%; animation-delay: 3s; font-size: 20px; }
  .sparkle:nth-child(6) { top: 75%; left: 30%; animation-delay: 1.8s; }
  .sparkle:nth-child(7) { top: 5%; right: 30%; animation-delay: .3s; font-size: 14px; }
  .sparkle:nth-child(8) { top: 50%; right: 25%; animation-delay: 3.6s; font-size: 28px; }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
    25%      { transform: translateY(-18px) rotate(8deg) scale(1.15); }
    50%      { transform: translateY(-8px) rotate(-5deg) scale(.95); }
    75%      { transform: translateY(-22px) rotate(3deg) scale(1.1); }
  }

  /* ── Page ── */
  .page {
    position: relative;
    z-index: 1;
    max-width: 920px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    padding: 48px 0 32px;
    animation: popIn .7s cubic-bezier(.34,1.56,.64,1) both;
  }
  .header .title {
    font-size: 36px;
    font-weight: 700;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
    letter-spacing: .04em;
  }
  .header .sub {
    font-size: 14px;
    color: var(--text-lt);
    letter-spacing: .12em;
  }

  /* ── Video Hero ── */
  .hero {
    animation: popIn .7s .15s cubic-bezier(.34,1.56,.64,1) both;
    margin-bottom: 20px;
  }
  .hero-frame {
    position: relative;
    border-radius: 28px;
    overflow: hidden;
    background: #fff;
    box-shadow:
      0 8px 40px var(--shadow),
      0 0 0 6px #fff,
      0 0 0 10px rgba(255,184,198,.25);
  }
  .hero-frame video {
    width: 100%;
    display: block;
  }

  /* ── Divider ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 36px 0 20px;
    animation: popIn .7s .25s cubic-bezier(.34,1.56,.64,1) both;
  }
  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(to right, transparent, var(--pink), transparent);
  }
  .divider-icon {
    font-size: 20px;
    animation: bounce 2s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  /* ── Gallery Strip ── */
  .gallery-wrap {
    animation: popIn .7s .35s cubic-bezier(.34,1.56,.64,1) both;
    position: relative;
    overflow: hidden;
    padding: 8px 0 56px;
    mask-image: linear-gradient(to right, transparent, #000 5%, #000 95%, transparent);
    -webkit-mask-image: linear-gradient(to right, transparent, #000 5%, #000 95%, transparent);
  }
  .gallery-track {
    display: flex;
    gap: 18px;
    width: max-content;
    animation: scroll 30s linear infinite;
    -webkit-animation: scroll 30s linear infinite;
    will-change: transform;
    padding: 8px 18px;
  }
  .gallery-wrap:hover .gallery-track {
    animation-play-state: paused;
  }
  @keyframes scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .gallery-track a {
    display: block;
    flex-shrink: 0;
    width: 250px;
    height: 375px;
    border-radius: 22px;
    overflow: hidden;
    cursor: zoom-in;
    position: relative;
    background: #fff;
    box-shadow:
      0 6px 24px var(--shadow),
      0 0 0 5px #fff,
      0 0 0 8px rgba(255,184,198,.18);
    transition: transform .4s cubic-bezier(.34,1.56,.64,1), box-shadow .4s ease;
  }
  .gallery-track a::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 22px;
    box-shadow: 0 0 40px -10px rgba(255,140,160,.15) inset;
    pointer-events: none;
  }
  .gallery-track a:hover {
    transform: translateY(-10px) scale(1.08);
    box-shadow:
      0 16px 48px rgba(255,130,160,.3),
      0 0 0 5px #fff,
      0 0 0 10px rgba(255,150,180,.35);
    z-index: 3;
  }
  .gallery-track img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .5s ease;
  }
  .gallery-track a:hover img {
    transform: scale(1.08);
  }

  /* ── Lightbox ── */
  .lightbox {
    display: flex;
    opacity: 0;
    visibility: hidden;
    position: fixed;
    inset: 0;
    background: rgba(255,240,245,.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
    transition: opacity .3s ease, visibility .3s ease;
  }
  .lightbox.active {
    opacity: 1;
    visibility: visible;
  }
  .lightbox img {
    max-width: 88vw;
    max-height: 86vh;
    border-radius: 20px;
    box-shadow:
      0 20px 60px rgba(255,150,180,.25),
      0 0 0 8px #fff;
    transform: scale(.92);
    transition: transform .4s cubic-bezier(.34,1.56,.64,1);
  }
  .lightbox.active img {
    transform: scale(1);
  }

  /* ── Footer ── */
  .footer {
    text-align: center;
    padding: 0 0 48px;
    color: var(--text-lt);
    font-size: 13px;
    animation: popIn .7s .45s cubic-bezier(.34,1.56,.64,1) both;
  }
  .footer .hearts {
    display: inline-block;
    animation: heartbeat 1.5s ease-in-out infinite;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15%      { transform: scale(1.25); }
    30%      { transform: scale(1); }
    45%      { transform: scale(1.15); }
    60%      { transform: scale(1); }
  }

  @keyframes popIn {
    from { opacity: 0; transform: translateY(30px) scale(.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── Mobile ── */
  @media (max-width: 640px) {
    .page { padding: 0 10px; }
    .header { padding: 32px 0 20px; }
    .header .title { font-size: 26px; }
    .hero-frame { border-radius: 20px; box-shadow: 0 6px 24px var(--shadow), 0 0 0 4px #fff, 0 0 0 7px rgba(255,184,198,.25); }
    .gallery-track a { width: 195px; height: 292px; border-radius: 16px; }
    .gallery-track a::after { border-radius: 16px; }
    .gallery-track { gap: 12px; padding: 4px 12px; }
    .gallery-wrap { padding-bottom: 40px; }
    .divider { padding: 28px 0 14px; }
  }
</style>


</head>
<body>

<div class="sparkles">
  <span class="sparkle">&#127775;</span>
  <span class="sparkle">&#10024;</span>
  <span class="sparkle">&#127800;</span>
  <span class="sparkle">&#128150;</span>
  <span class="sparkle">&#127776;</span>
  <span class="sparkle">&#127872;</span>
  <span class="sparkle">&#11088;</span>
  <span class="sparkle">&#128156;</span>
</div>

<div class="page">

  <div class="header">
    <div class="title">✨ 小可爱的时光相册</div>
    <div class="sub">· 记 录 每 一 个 可 爱 瞬 间 ·</div>
  </div>

  <div class="hero">
    <div class="hero-frame">
      <video controls playsinline preload="none" poster="yang_poster_sm.webp">
        <source src="yang_video_small.mp4" type="video/mp4">
      </video>
    </div>
  </div>

  <div class="divider">
    <span class="divider-icon">📸</span>
  </div>

  <div class="gallery-wrap">
    <div class="gallery-track" id="galleryTrack"></div>
  </div>

  <div class="footer">
    <span class="hearts">💕</span> 用镜头记录成长 <span class="hearts">💕</span>
  </div>

</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt="">
</div>

<script>
const photos = [
  "IMG_2466_sm.webp","IMG_2467_sm.webp","IMG_2475_sm.webp","IMG_2478_sm.webp",
  "IMG_2480_sm.webp","IMG_2481_sm.webp","IMG_2483_sm.webp","IMG_2493_sm.webp","IMG_2494_sm.webp"
];

const track = document.getElementById('galleryTrack');
[...photos, ...photos].forEach(p => {
  const a = document.createElement('a');
  a.href = '#';
  a.onclick = e => { e.preventDefault(); openLightbox(p); };
  const img = document.createElement('img');
  img.src = p;
  img.alt = '';
  img.loading = 'eager';
  a.appendChild(img);
  track.appendChild(a);
});

function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('active');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
</script>

</body>
</html>
